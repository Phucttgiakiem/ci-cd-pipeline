services:
  mongo:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: 123456
      MONGO_INITDB_DATABASE: backend_service
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  backend-service:
    image: phuctranvn/my-node-api:${{ IMAGE_TAG }}
    container_name: backend-service
    ports:
      - "8080:8080"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DATABASE=backend_service
      - MONGO_USERNAME=root
      - MONGO_PASSWORD=123456
    networks:
      - app_network
    restart: unless-stopped

volumes:
  mongo_data:

networks:
  app_network: